services:
  web-audits-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-audits-api
    ports:
      - "8095:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-audits-dashboard:
    image: nginx:alpine
    container_name: web-audits-dashboard
    ports:
      - "8096:80"
    volumes:
      - ./src/dashboard/public:/usr/share/nginx/html
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
