<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Audits Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
.container{max-width:1400px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #1e293b}
.header h1{font-size:24px;color:#f8fafc}
.section{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:20px}
.section h2{font-size:18px;margin-bottom:16px;color:#f1f5f9}
.form-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.form-group{flex:1;min-width:200px}
.form-group label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:14px}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer}
.btn-primary{background:#3b82f6;color:white}
.btn-secondary{background:#334155;color:#e2e8f0}
.score-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:bold;font-size:18px}
.score-green{background:#064e3b;color:#34d399}
.score-yellow{background:#451a03;color:#fbbf24}
.score-red{background:#450a0a;color:#f87171}
.cat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #334155}
.rec{border-left:4px solid #3b82f6;padding:12px;margin-bottom:8px;background:#0f172a;border-radius:0 8px 8px 0}
.rec.high{border-color:#f87171}
.rec.medium{border-color:#fbbf24}
.rec.low{border-color:#34d399}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #334155;font-size:14px}
th{color:#94a3b8;font-weight:500;font-size:12px;text-transform:uppercase}
tr:hover{background:#0f172a}
.empty{text-align:center;padding:60px;color:#64748b}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;
const API=window.location.origin.replace(':8095',':8094');
function App(){
  const[audits,setAudits]=useState([]);
  const[url,setUrl]=useState('');
  const[selected,setSelected]=useState(null);
  const load=useCallback(async()=>{
    try{const r=await fetch(`${API}/audits`);const d=await r.json();setAudits(d.audits||[])}catch(e){}
  },[]);
  useEffect(()=>{load();const i=setInterval(load,5000);return()=>clearInterval(i)},[load]);
  const submit=async()=>{
    if(!url.trim())return;
    const r=await fetch(`${API}/audits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await r.json();setUrl('');setSelected(d.audit_id);
    setTimeout(load,1000);
  };
  const viewAudit=async(aid)=>{
    const r=await fetch(`${API}/audits/${aid}`);const d=await r.json();setSelected(d);
  };
  const scoreClass=s=>s>=70?'score-green':s>=50?'score-yellow':'score-red';
  return(
    <div className="container">
      <div className="header"><h1>🔍 Web Audits</h1></div>
      <div className="section">
        <h2>New Audit</h2>
        <div className="form-row">
          <div className="form-group" style={{flex:3}}><label>Website URL</label><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://example.com"/></div>
          <div className="form-group" style={{flex:1,display:'flex',alignItems:'flex-end'}}><button className="btn btn-primary" onClick={submit}>Run Audit</button></div>
        </div>
      </div>
      <div className="section">
        <h2>Audits</h2>
        {audits.length===0?<div className="empty">No audits yet</div>:
        <table>
          <thead><tr><th>URL</th><th>Score</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody>
            {audits.map(a=>(
              <tr key={a.id}>
                <td><strong>{a.url}</strong></td>
                <td>{a.score!=null?<span className={`score-badge ${scoreClass(a.score)}`}>{a.score}</span>:'-'}</td>
                <td>{a.status}</td>
                <td>{new Date(a.created_at).toLocaleDateString()}</td>
                <td><button className="btn btn-secondary" onClick={()=>viewAudit(a.id)}>View</button></td>
              </tr>
            ))}
          </tbody>
        </table>}
      </div>
      {selected && typeof selected==='object' && (
        <div className="section">
          <h2>Audit Results — {selected.url}</h2>
          <div style={{display:'flex',gap:'20px',marginBottom:'20px',alignItems:'center'}}>
            <span className={`score-badge ${scoreClass(selected.score)}`}>Score: {selected.score}/100</span>
            <span style={{color:'#94a3b8'}}>{selected.status}</span>
          </div>
          <h3 style={{marginBottom:'12px'}}>Categories</h3>
          {(selected.categories||[]).map(c=>(
            <div key={c.id} className="cat-row">
              <span style={{textTransform:'capitalize'}}>{c.category}</span>
              <span className={`score-badge ${scoreClass(c.score)}`}>{c.score}</span>
            </div>
          ))}
          <h3 style={{margin:'20px 0 12px'}}>Recommendations</h3>
          {(selected.recommendations||[]).map(r=>(
            <div key={r.id} className={`rec ${r.priority}`}>
              <strong>{r.title}</strong>
              <p style={{color:'#94a3b8',marginTop:'4px'}}>{r.description}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
